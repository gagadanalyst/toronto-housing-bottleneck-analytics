name: V2 Snapshot Archive

on:
  push:
    branches:
      - refactor/separate-extraction
    paths:
      - .github/workflows/v2-snapshot-archive.yml
      - extraction/**
  pull_request:
    branches:
      - refactor/separate-extraction
    paths:
      - .github/workflows/v2-snapshot-archive.yml
      - extraction/**
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Explicitly authorize permanent V2 Release publication
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: toronto-v2-snapshot-archive
  cancel-in-progress: false
  queue: max

jobs:
  archive:
    if: >-
      github.event_name != 'schedule' ||
      vars.TORONTO_EXTRACTION_ENABLED == 'true'
    name: Extract and publish V2 source snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: extraction/pyproject.toml

      - name: Install extraction package
        working-directory: extraction
        run: python -m pip install -e ".[dev]"

      - name: Run lint, formatting and tests
        working-directory: extraction
        run: |
          ruff check src tests
          ruff format --check src tests
          pytest -q

      - name: Authorize manual V2 archive publication
        if: github.event_name == 'workflow_dispatch'
        env:
          EXTRACTION_ENABLED: ${{ vars.TORONTO_EXTRACTION_ENABLED }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          if [ "$EXTRACTION_ENABLED" != "true" ] ||
             [ "$CONFIRM_PUBLISH" != "true" ] ||
             [ "$GITHUB_REF" != "refs/heads/refactor/separate-extraction" ]; then
            echo "Manual V2 publication requires TORONTO_EXTRACTION_ENABLED=true, confirm_publish=true, and refactor/separate-extraction." >&2
            exit 1
          fi

      - name: Require a branch ref for archive publication
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "V2 archive publication and inventory updates require a branch ref." >&2
            exit 1
          fi

      - name: Check whether source snapshots changed
        id: change_check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          toronto-check-snapshot --config config/sources.yml --repository "$GITHUB_REPOSITORY"

      - name: Extract and validate Active/Cleared snapshot
        id: extract
        if: >-
          (
            (github.event_name == 'schedule' &&
             vars.TORONTO_EXTRACTION_ENABLED == 'true') ||
            (github.event_name == 'workflow_dispatch' &&
             vars.TORONTO_EXTRACTION_ENABLED == 'true' &&
             inputs.confirm_publish == true &&
             github.ref == 'refs/heads/refactor/separate-extraction')
          ) &&
          steps.change_check.outcome == 'success' &&
          steps.change_check.outputs.no_change != 'true'
        working-directory: extraction
        env:
          SNAPSHOT_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          toronto-extract \
            --config config/sources.yml \
            --output data/extraction

          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path

          archives = sorted(
              Path("data/extraction/snapshots").glob("*.zip")
          )

          if len(archives) != 1:
              raise SystemExit(
                  f"Expected one new snapshot archive, found {len(archives)}."
              )

          archive = archives[0]

          print(f"archive={archive.as_posix()}")
          print(f"workspace_archive=extraction/{archive.as_posix()}")
          PY

      - name: Report unchanged source snapshots
        if: >-
          (
            (github.event_name == 'schedule' &&
             vars.TORONTO_EXTRACTION_ENABLED == 'true') ||
            (github.event_name == 'workflow_dispatch' &&
             vars.TORONTO_EXTRACTION_ENABLED == 'true' &&
             inputs.confirm_publish == true &&
             github.ref == 'refs/heads/refactor/separate-extraction')
          ) &&
          steps.change_check.outcome == 'success' &&
          steps.change_check.outputs.no_change == 'true'
        run: echo "Active and Cleared are unchanged; extraction and publication skipped."

      - name: Preserve validated snapshot for retry
        if: >-
          always() &&
          (
            (github.event_name == 'schedule' &&
             vars.TORONTO_EXTRACTION_ENABLED == 'true') ||
            (github.event_name == 'workflow_dispatch' &&
             vars.TORONTO_EXTRACTION_ENABLED == 'true' &&
             inputs.confirm_publish == true &&
             github.ref == 'refs/heads/refactor/separate-extraction')
          ) &&
          steps.change_check.outcome == 'success' &&
          steps.change_check.outputs.no_change != 'true' &&
          steps.extract.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toronto-v2-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.extract.outputs.workspace_archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Publish and verify V2 GitHub Release asset
        if: >-
          (
            (github.event_name == 'schedule' &&
             vars.TORONTO_EXTRACTION_ENABLED == 'true') ||
            (github.event_name == 'workflow_dispatch' &&
             vars.TORONTO_EXTRACTION_ENABLED == 'true' &&
             inputs.confirm_publish == true &&
             github.ref == 'refs/heads/refactor/separate-extraction')
          ) &&
          steps.change_check.outcome == 'success' &&
          steps.change_check.outputs.no_change != 'true' &&
          steps.extract.outcome == 'success'
        working-directory: extraction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          toronto-publish-snapshot \
            --archive "${{ steps.extract.outputs.archive }}" \
            --repository "$GITHUB_REPOSITORY"

      - name: Append verified archive to snapshot inventory
        if: >-
          (
            (github.event_name == 'schedule' &&
             vars.TORONTO_EXTRACTION_ENABLED == 'true') ||
            (github.event_name == 'workflow_dispatch' &&
             vars.TORONTO_EXTRACTION_ENABLED == 'true' &&
             inputs.confirm_publish == true &&
             github.ref == 'refs/heads/refactor/separate-extraction')
          ) &&
          steps.change_check.outcome == 'success' &&
          steps.change_check.outputs.no_change != 'true' &&
          steps.extract.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "Inventory updates require a branch ref." >&2
            exit 1
          fi
          python -m scripts.snapshot_inventory append \
            --archive "${{ steps.extract.outputs.workspace_archive }}" \
            --repository "$GITHUB_REPOSITORY"
          git ls-files --error-unmatch snapshot_inventory.json >/dev/null
          if git diff --quiet HEAD -- snapshot_inventory.json; then
            echo "Snapshot inventory already contains this archive."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- snapshot_inventory.json
            git commit --only -m "chore: append verified snapshot inventory entry" -- snapshot_inventory.json
            auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
              push origin "HEAD:${GITHUB_REF_NAME}"
          fi
