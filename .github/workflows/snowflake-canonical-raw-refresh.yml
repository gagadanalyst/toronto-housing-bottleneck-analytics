name: Snowflake Canonical RAW Refresh

on:
  # Reconcile archives if a repository_dispatch handoff was missed.
  schedule:
    - cron: "23 8 * * *"
  repository_dispatch:
    types: [toronto_raw_snapshot_ready]
  workflow_dispatch:
    inputs:
      snapshot_run_id:
        description: Recent main-branch CD run ID with an archived raw snapshot
        required: true
        type: string
      snapshot_run_attempt:
        description: CD workflow attempt number (normally 1)
        required: true
        default: "1"
        type: string
      release_tag:
        description: Monthly GitHub Release tag containing the immutable bundle
        required: true
        type: string
      confirm_canonical_raw:
        description: Confirm this run may update SCD2 history in TORONTO.RAW
        required: true
        default: false
        type: boolean


permissions:
  contents: read
  actions: write

# Queue up to 100 pending refreshes instead of replacing the prior pending run.
concurrency:
  group: toronto-snowflake-production-promotion
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    # Fail closed: only the explicit repository variable enables Snowflake compute.
    if: >-
      vars.SNOWFLAKE_OPERATIONS_ENABLED == 'true' &&
      vars.TORONTO_CANONICAL_REPLAY_ENABLED == 'true' &&
      vars.TORONTO_CANONICAL_REPLAY_BASELINE_SNAPSHOT_ID != '' &&
      vars.TORONTO_CANONICAL_REPLAY_BASELINE_SNAPSHOT_COUNT != '' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'repository_dispatch' &&
         github.event.action == 'toronto_raw_snapshot_ready') ||
        (github.event_name == 'workflow_dispatch' &&
         inputs.confirm_canonical_raw == true)
      )
    name: Refresh and verify canonical Snowflake RAW
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TORONTO_WAREHOUSE_KIND: snowflake
      TORONTO_WAREHOUSE_CREDENTIALS: ${{ secrets.SNOWFLAKE_DLT_CONNECTION }}
      SNOWFLAKE_DLT_CONNECTION: ${{ secrets.SNOWFLAKE_DLT_CONNECTION }}
      TORONTO_CANONICAL_REPLAY_ENABLED: ${{ vars.TORONTO_CANONICAL_REPLAY_ENABLED }}
      TORONTO_CANONICAL_REPLAY_BASELINE_SNAPSHOT_ID: ${{ vars.TORONTO_CANONICAL_REPLAY_BASELINE_SNAPSHOT_ID }}
      TORONTO_CANONICAL_REPLAY_BASELINE_SNAPSHOT_COUNT: ${{ vars.TORONTO_CANONICAL_REPLAY_BASELINE_SNAPSHOT_COUNT }}
      SNAPSHOT_SOURCE_RUN_ID: ${{ github.event.client_payload.run_id || inputs.snapshot_run_id }}
      SNAPSHOT_SOURCE_RUN_ATTEMPT: ${{ github.event.client_payload.run_attempt || inputs.snapshot_run_attempt }}
      SNAPSHOT_SOURCE_COMMIT: ${{ github.event.client_payload.source_commit || '' }}
      SNAPSHOT_ARCHIVE_TAG: ${{ github.event.client_payload.release_tag || inputs.release_tag }}
      SNAPSHOT_ARCHIVE_ASSET: ${{ github.event.client_payload.asset_name || format('toronto-raw-snapshot-bundle-{0}-{1}.zip', inputs.snapshot_run_id, inputs.snapshot_run_attempt) }}
      SNAPSHOT_BUNDLE_PATH: data/snapshot-download/${{ github.event.client_payload.asset_name || format('toronto-raw-snapshot-bundle-{0}-{1}.zip', inputs.snapshot_run_id, inputs.snapshot_run_attempt) }}
      RUNTIME__DLTHUB_TELEMETRY: "false"
      DO_NOT_TRACK: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require explicit canonical RAW confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM_CANONICAL_RAW: ${{ inputs.confirm_canonical_raw }}
        run: |
          if [ "$CONFIRM_CANONICAL_RAW" != "true" ]; then
            echo "Refusing to write canonical SCD2 tables in TORONTO.RAW without explicit confirmation."
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Snowflake-enabled ingestion package
        run: |
          python -m pip install --upgrade "pip>=26.2.1,<27"
          python -m pip install -e ".[snowflake]"

      - name: Prepare isolated Snowflake RAW candidate
        run: python scripts/prepare_snowflake_raw_candidate.py --github-env "$GITHUB_ENV"

      - name: Replay approved archived snapshots in candidate schema
        id: replay_candidate_archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/replay_snowflake_snapshot_backlog.py \
              --run-id "$SNAPSHOT_SOURCE_RUN_ID" \
              --attempt "$SNAPSHOT_SOURCE_RUN_ATTEMPT" \
              --release-tag "$SNAPSHOT_ARCHIVE_TAG" \
              --asset-name "$SNAPSHOT_ARCHIVE_ASSET"
          else
            python scripts/replay_snowflake_snapshot_backlog.py
          fi

      - name: Validate and promote Snowflake RAW candidate
        id: promote_raw_candidate
        if: steps.replay_candidate_archives.outputs.has_pending_archives == 'true'
        env:
          SNOWFLAKE_DLT_CONNECTION: ${{ secrets.SNOWFLAKE_DLT_CONNECTION }}
        run: python scripts/promote_snowflake_raw_candidate.py

      - name: Remove unused Snowflake RAW candidate after no-op replay
        if: >-
          steps.replay_candidate_archives.outcome == 'success' &&
          steps.replay_candidate_archives.outputs.has_pending_archives != 'true'
        run: python scripts/prepare_snowflake_raw_candidate.py --drop-candidate

      # GITHUB_TOKEN-triggered runs do not start downstream workflow_run runs.
      # workflow_dispatch is an explicit exception, so hand off through that event.
      - name: Dispatch Snowflake serving build after successful RAW refresh
        if: >-
          steps.promote_raw_candidate.outcome == 'success' &&
          vars.SNOWFLAKE_OPERATIONS_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_REFRESH_RUN_ID: ${{ github.run_id }}
        run: |
          gh workflow run snowflake-serving-schema.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirm_serving_schema=true \
            -f raw_refresh_run_id="$RAW_REFRESH_RUN_ID"
          echo "Dispatched serving build for successful RAW refresh run ${RAW_REFRESH_RUN_ID}."

