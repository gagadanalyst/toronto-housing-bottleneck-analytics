name: Snowflake Live Ingestion Smoke

# This is the full live CKAN extraction test. Run it deliberately rather than
# repeating two large source extracts on every code change; migrated-history
# continuity uses a bounded sample from the exact migration baseline.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: toronto-snowflake-live-ingestion-smoke
  cancel-in-progress: false

jobs:
  live-ingestion:
    name: Extract and replay real Active/Cleared snapshots in an isolated schema
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TORONTO_WAREHOUSE_KIND: snowflake
      TORONTO_WAREHOUSE_CREDENTIALS: ${{ secrets.SNOWFLAKE_DLT_CONNECTION }}
      TORONTO_WAREHOUSE_DATASET: SNOWFLAKE_INGEST_SMOKE_${{ github.run_id }}
      RUNTIME__DLTHUB_TELEMETRY: "false"
      DO_NOT_TRACK: "1"
      AWS_REGION: ca-central-1
      AWS_EC2_METADATA_DISABLED: "true"
      TORONTO_HISTORICAL_PARQUET_ROOT: data/recovery/parquet-2026-10-23

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install the Snowflake destination
        run: |
          python -m pip install --upgrade "pip>=26.2.1,<27"
          python -m pip install -e ".[snowflake]"

      - name: Check required configuration
        run: |
          test -n "$TORONTO_WAREHOUSE_CREDENTIALS" || {
            echo "Missing repository secret: SNOWFLAKE_DLT_CONNECTION"
            exit 1
          }
          case "$TORONTO_WAREHOUSE_DATASET" in
            SNOWFLAKE_INGEST_SMOKE_*) ;;
            *) echo "Refusing to run outside the isolated test schema"; exit 1 ;;
          esac

      - name: Download original migration Parquet for diagnostics
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$TORONTO_HISTORICAL_PARQUET_ROOT"
          gh run download 40001052104 \
            --repo "$GITHUB_REPOSITORY" \
            --name toronto-parquet-40001052104 \
            --dir "$TORONTO_HISTORICAL_PARQUET_ROOT"
          find "$TORONTO_HISTORICAL_PARQUET_ROOT" -type f -name data.parquet -print

      - name: Run live ingestion and idempotent replay checks
        run: python scripts/snowflake_live_ingestion_smoke.py

      - name: Upload hash mismatch diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hash-mismatch-diagnostics-${{ github.run_id }}
          path: data/diagnostics/hash_mismatch_diagnostics.duckdb
          if-no-files-found: warn
          retention-days: 14
