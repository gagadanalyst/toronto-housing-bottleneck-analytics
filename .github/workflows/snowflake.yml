name: Snowflake Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toronto-snowflake-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Controlled Snowflake SCD2 validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TORONTO_WAREHOUSE_KIND: snowflake
      TORONTO_WAREHOUSE_CREDENTIALS: ${{ secrets.SNOWFLAKE_DLT_CONNECTION }}
      TORONTO_WAREHOUSE_DATASET: SNOWFLAKE_SMOKE
      RUNTIME__DLTHUB_TELEMETRY: "false"
      DO_NOT_TRACK: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install the Snowflake destination
        run: |
          python -m pip install --upgrade "pip>=26.2.1,<27"
          python -m pip install -e ".[snowflake]"

      - name: Check required configuration
        run: |
          test -n "$TORONTO_WAREHOUSE_CREDENTIALS" || {
            echo "Missing repository secret: SNOWFLAKE_DLT_CONNECTION"
            exit 1
          }

      - name: Verify Snowflake connectivity and SCD2 behaviour
        run: python scripts/snowflake_smoke_test.py
