name: Snowflake History Migration

on:
  push:
    branches:
      - feat/snowflake-ingestion-smoke
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: toronto-snowflake-history-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Backfill and verify SCD2 history
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TORONTO_WAREHOUSE_KIND: snowflake
      TORONTO_WAREHOUSE_CREDENTIALS: ${{ secrets.SNOWFLAKE_DLT_CONNECTION }}
      TORONTO_WAREHOUSE_DATASET: RAW
      RUNTIME__DLTHUB_TELEMETRY: "false"
      DO_NOT_TRACK: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Snowflake and DuckDB dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2.1,<27"
          python -m pip install -e ".[snowflake]"

      - name: Download the October 23 recovery database
        run: |
          set -euo pipefail
          mkdir -p data/recovery/warehouse-2026-10-23
          gh run download 40001052104 \
            --repo "$GITHUB_REPOSITORY" \
            --name toronto-duckdb-40001052104 \
            --dir data/recovery/warehouse-2026-10-23
          db="$(find data/recovery/warehouse-2026-10-23 \
            -type f -name toronto.duckdb -print -quit)"
          test -n "$db"
          test -s "$db"
          echo "SOURCE_DB=$db" >> "$GITHUB_ENV"
          ls -lh "$db"

      - name: Check Snowflake configuration
        run: |
          test -n "$TORONTO_WAREHOUSE_CREDENTIALS" || {
            echo "Missing secret: SNOWFLAKE_DLT_CONNECTION"
            exit 1
          }

      - name: Migrate history and dlt metadata
        run: |
          python scripts/migrate_duckdb_history_to_snowflake.py \
            --source-db "$SOURCE_DB"
