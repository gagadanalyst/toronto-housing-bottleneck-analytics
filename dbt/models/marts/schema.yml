version: 2

models:
  - name: fct_active_permit_revision
    config:
      contract:
        enforced: true
    description: >-
      One row per logical Active Permits revision, keyed by permit_num,
      revision_num, and permit_type. Uses current SCD2 source rows only and
      consolidates duplicate physical rows. Builder, status, application
      date, issue date, and geographic identifier are published only when
      all current source rows agree on the same non-null value. Diagnostic
      columns retain observed values and identify disagreements, including
      missing versus non-missing values. All-null attributes are missing,
      not conflicts. This is a current-source snapshot, not a complete
      historical record of every source revision.
    columns:
      - name: permit_num
        data_type: VARCHAR
        description: Permit number; part of the logical permit-revision key.
      - name: revision_num
        data_type: VARCHAR
        description: Permit revision number; part of the logical permit-revision key.
      - name: permit_type
        data_type: VARCHAR
        description: City-defined permit type; part of the logical permit-revision key.
        data_tests:
          # Catch future permit types that are missing from the dimension.
          - relationships:
              arguments:
                to: ref('dim_permit_type')
                field: permit_type
      - name: current_source_row_count
        data_type: BIGINT
        description: Number of physical current SCD2 source rows consolidated into this logical revision.
      - name: builder_name
        data_type: VARCHAR
        description: Builder name, published only when every current source row contains the same non-null value.
      - name: observed_builder_names
        data_type: VARCHAR
        description: Distinct observed builder names across current rows, including a marker for missing values.
      - name: builder_name_conflict
        data_type: BOOLEAN
        description: True when observed builder names disagree, including a mixture of missing and non-missing values.
      - name: status
        data_type: VARCHAR
        description: Trimmed status, published only when every current source row contains the same non-null value.
      - name: observed_status_values
        data_type: VARCHAR
        description: Distinct observed trimmed status values across current rows, including a marker for missing values.
      - name: has_status_conflict
        data_type: BOOLEAN
        description: True when status values disagree across current source rows, including missing versus non-missing values.
      - name: application_date
        data_type: DATE
        description: Application date, published only when every current source row contains the same non-null date.
      - name: observed_application_dates
        data_type: VARCHAR
        description: Distinct application dates observed across current rows, including a marker for missing values.
      - name: application_date_conflict
        data_type: BOOLEAN
        description: True when application dates disagree across current source rows, including missing versus non-missing values.
      - name: issued_date
        data_type: DATE
        description: Issue date, published only when every current source row contains the same non-null date.
      - name: observed_issued_dates
        data_type: VARCHAR
        description: Distinct issue dates observed across current rows, including a marker for missing values.
      - name: issued_date_conflict
        data_type: BOOLEAN
        description: True when issue dates disagree across current source rows, including missing versus non-missing values.
      - name: geo_id
        data_type: VARCHAR
        description: Geographic identifier, published only when every current source row contains the same non-null value.
      - name: observed_geo_ids
        data_type: VARCHAR
        description: Distinct geographic identifiers observed across current rows, including a marker for missing values.
      - name: geo_id_conflict
        data_type: BOOLEAN
        description: True when geographic identifiers disagree across current source rows, including missing versus non-missing values.

  - name: mart_active_permit_age
    config:
      contract:
        enforced: true
    description: >-
      One row per logical current Active Permits revision, with its age
      measured as elapsed calendar days from application_date to as_of_date.
      Eligibility is determined by the first matching exclusion rule:
      status conflict, missing status, terminal or exception status, an
      application-date conflict, or a missing application date. Eligible
      permits have not necessarily completed their lifecycle. Their ages
      are right-censored observations and must not be interpreted as
      completed permit durations.
    semantic_model:
      enabled: true
    primary_entity: active_permit_revision
    agg_time_dimension: application_date
    metrics:
      - name: active_permit_revision_count
        description: Count of current logical Active permit revisions.
        type: simple
        agg: sum
        expr: 1
      - name: eligible_active_permit_revision_count
        description: Count of current Active permit revisions eligible for age analysis.
        type: simple
        agg: count
        expr: age_since_application_days
      - name: median_active_permit_age_days
        description: Median elapsed calendar-day age of eligible current Active permits; this is right-censored age, not completed lifecycle duration.
        type: simple
        agg: median
        expr: age_since_application_days
      - name: p90_active_permit_age_days
        description: Approximate continuous 90th percentile of elapsed calendar-day age for eligible current Active permits.
        type: simple
        agg: percentile
        expr: age_since_application_days
        percentile: 0.9
        percentile_type: continuous
    columns:
      - name: permit_num
        data_type: VARCHAR
        description: Permit number; part of the logical permit-revision key.
      - name: revision_num
        data_type: VARCHAR
        description: Permit revision number; part of the logical permit-revision key.
      - name: permit_type
        data_type: VARCHAR
        description: City-defined permit type; part of the logical permit-revision key.
        dimension:
          type: categorical
      - name: builder_name
        data_type: VARCHAR
        description: Builder name consolidated from the current source rows.
      - name: status
        data_type: VARCHAR
        description: Consolidated trimmed source status.
        dimension:
          type: categorical
      - name: status_normalized
        data_type: VARCHAR
        description: Lowercase trimmed status used for cohort classification.
      - name: application_date
        data_type: DATE
        description: Consolidated application date; required for age eligibility.
        granularity: day
        dimension:
          type: time
      - name: issued_date
        data_type: DATE
        description: Consolidated issue date, retained for analysis and drill-down.
      - name: geo_id
        data_type: VARCHAR
        description: Consolidated geographic identifier, retained for analysis and drill-down.
      - name: current_source_row_count
        data_type: BIGINT
        description: Number of physical current source rows consolidated into the logical revision.
      - name: has_status_conflict
        data_type: BOOLEAN
        description: Inherited flag indicating disagreement among current source status values.
      - name: application_date_conflict
        data_type: BOOLEAN
        description: Inherited flag indicating disagreement among current source application dates.
      - name: issued_date_conflict
        data_type: BOOLEAN
        description: Inherited flag indicating disagreement among current source issue dates.
      - name: geo_id_conflict
        data_type: BOOLEAN
        description: Inherited flag indicating disagreement among current source geographic identifiers.
      - name: as_of_date
        data_type: DATE
        description: Date at which age is measured; defaults from dbt run_started_at and can be overridden with the as_of_date variable.
      - name: cohort_exclusion_reason
        data_type: VARCHAR
        description: >-
          First applicable exclusion reason: status_conflict, missing_status,
          terminal_or_exception_status, application_date_conflict, or
          missing_application_date. Null means the revision is eligible.
      - name: is_age_eligible
        data_type: BOOLEAN
        description: True when cohort_exclusion_reason is null.
      - name: age_since_application_days
        data_type: BIGINT
        description: >-
          Elapsed calendar days from application_date to as_of_date for
          eligible revisions; null for excluded revisions. This is an
          observed age, not a completed lifecycle duration or business-day count.
  - name: fct_cleared_permit_revision
    config:
      contract:
        enforced: true
    description: >-
      One row per logical cleared building-permit revision, keyed by
      permit_num, revision_num, and permit_type. The model uses current SCD2
      source rows only and consolidates duplicate current source rows without
      arbitrarily selecting conflicting values. Lifecycle dates and geo_id are
      published only when all current rows for a revision agree on the same
      non-null value. Negative lifecycle durations are retained in the raw
      duration columns and excluded from the corresponding analysis-facing
      duration columns. Durations are elapsed calendar days, not business days.
    semantic_model:
      enabled: true
    primary_entity: cleared_permit_revision
    agg_time_dimension: application_date
    metrics:
      - name: cleared_permit_revision_count
        description: Count of current logical Cleared permit revisions.
        type: simple
        agg: sum
        expr: 1
      - name: closed_application_to_issue_valid_revision_count
        description: Count of logical Closed revisions with a non-negative application-to-issue interval.
        type: simple
        agg: count
        expr: "CASE WHEN LOWER(status) = 'closed' THEN application_to_issue_days ELSE NULL END"
      - name: closed_application_to_completion_valid_revision_count
        description: Count of logical Closed revisions with a non-negative application-to-completion interval.
        type: simple
        agg: count
        expr: "CASE WHEN LOWER(status) = 'closed' THEN application_to_completion_days ELSE NULL END"
      - name: closed_issue_to_completion_valid_revision_count
        description: Count of logical Closed revisions with a non-negative issue-to-completion interval.
        type: simple
        agg: count
        expr: "CASE WHEN LOWER(status) = 'closed' THEN issue_to_completion_days ELSE NULL END"
      - name: median_application_to_issue_days
        description: Median non-negative elapsed calendar days from application to issue among records marked Closed.
        type: simple
        agg: median
        expr: "CASE WHEN LOWER(status) = 'closed' THEN application_to_issue_days ELSE NULL END"
      - name: p90_application_to_issue_days
        description: Approximate continuous 90th percentile of non-negative elapsed calendar days from application to issue among records marked Closed.
        type: simple
        agg: percentile
        expr: "CASE WHEN LOWER(status) = 'closed' THEN application_to_issue_days ELSE NULL END"
        percentile: 0.9
        percentile_type: continuous
      - name: median_application_to_completion_days
        description: Median non-negative elapsed calendar days from application to completion among records marked Closed.
        type: simple
        agg: median
        expr: "CASE WHEN LOWER(status) = 'closed' THEN application_to_completion_days ELSE NULL END"
      - name: p90_application_to_completion_days
        description: Approximate continuous 90th percentile of non-negative elapsed calendar days from application to completion among records marked Closed.
        type: simple
        agg: percentile
        expr: "CASE WHEN LOWER(status) = 'closed' THEN application_to_completion_days ELSE NULL END"
        percentile: 0.9
        percentile_type: continuous
      - name: median_issue_to_completion_days
        description: Median non-negative elapsed calendar days from issue to completion among records marked Closed.
        type: simple
        agg: median
        expr: "CASE WHEN LOWER(status) = 'closed' THEN issue_to_completion_days ELSE NULL END"
      - name: p90_issue_to_completion_days
        description: Approximate continuous 90th percentile of non-negative elapsed calendar days from issue to completion among records marked Closed.
        type: simple
        agg: percentile
        expr: "CASE WHEN LOWER(status) = 'closed' THEN issue_to_completion_days ELSE NULL END"
        percentile: 0.9
        percentile_type: continuous
    columns:
      - name: permit_num
        data_type: VARCHAR
        description: Permit number; part of the logical permit-revision key.
      - name: revision_num
        data_type: VARCHAR
        description: Permit revision number; part of the logical permit-revision key.
      - name: permit_type
        data_type: VARCHAR
        description: City permit type; part of the logical permit-revision key.
        dimension:
          type: categorical
        data_tests:
          # Purpose: prove every fact permit type has a corresponding dimension row,
          # while the dimension key is unique and non-null.
          - relationships:
              arguments:
                to: ref('dim_permit_type')
                field: permit_type
      - name: current_source_row_count
        data_type: BIGINT
        description: Number of current SCD2 source rows consolidated into this logical revision.
      - name: observed_builder_names
        data_type: VARCHAR
        description: Distinct non-null builder names observed across current source rows, concatenated for diagnostics.
      - name: builder_name_conflict
        data_type: BOOLEAN
        description: True when current source rows disagree on builder_name, including null versus non-null values.
      - name: application_date_conflict
        data_type: BOOLEAN
        description: True when current source rows disagree on application_date, including null versus non-null values.
      - name: issued_date_conflict
        data_type: BOOLEAN
        description: True when current source rows disagree on issued_date, including null versus non-null values.
      - name: completed_date_conflict
        data_type: BOOLEAN
        description: True when current source rows disagree on completed_date, including null versus non-null values.
      - name: geo_id_conflict
        data_type: BOOLEAN
        description: True when current source rows disagree on geo_id, including null versus non-null values.
      - name: application_date
        data_type: DATE
        description: Application date, published only when every current source row has the same non-null date.
        granularity: day
        dimension:
          type: time
      - name: issued_date
        data_type: DATE
        description: Issue date, published only when every current source row has the same non-null date.
      - name: completed_date
        data_type: DATE
        description: Completion date normalized to the source's UTC calendar date, published only when every current source row has the same non-null date.
      - name: geo_id
        data_type: VARCHAR
        description: Geographic identifier, published only when every current source row has the same non-null value.
      - name: application_to_issue_days_raw
        data_type: BIGINT
        description: Signed elapsed calendar days from application to issue; negative values are retained for anomaly analysis.
      - name: application_to_completion_days_raw
        data_type: BIGINT
        description: Signed elapsed calendar days from application to completion; negative values are retained for anomaly analysis.
      - name: issue_to_completion_days_raw
        data_type: BIGINT
        description: Signed elapsed calendar days from issue to completion; negative values are retained for anomaly analysis.
      - name: application_to_issue_days
        data_type: BIGINT
        description: Application-to-issue elapsed calendar days; null when the raw duration is negative or either date is unavailable.
      - name: application_to_completion_days
        data_type: BIGINT
        description: Application-to-completion elapsed calendar days; null when the raw duration is negative or either date is unavailable.
      - name: issue_to_completion_days
        data_type: BIGINT
        description: Issue-to-completion elapsed calendar days; null when the raw duration is negative or either date is unavailable.
      - name: application_to_issue_negative
        data_type: BOOLEAN
        description: True when the raw application-to-issue duration is negative; null when it cannot be calculated.
      - name: application_to_completion_negative
        data_type: BOOLEAN
        description: True when the raw application-to-completion duration is negative; null when it cannot be calculated.
      - name: issue_to_completion_negative
        data_type: BOOLEAN
        description: True when the raw issue-to-completion duration is negative; null when it cannot be calculated.
      - name: status
        data_type: VARCHAR
        description: >-
          Normalized status, published only when all current source rows
          agree on the same non-null value.
        dimension:
          type: categorical
      - name: observed_status_values
        data_type: VARCHAR
        description: Distinct normalized status values observed across current
          source rows, including a marker for missing values.
      - name: has_status_conflict
        data_type: BOOLEAN
        description: True when current source rows disagree on status, including null versus non-null.
  - name: dim_date
    description: >-
      Continuous daily calendar spanning the observed Active and Cleared permit
      dates through the current date. One row per calendar date.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Calendar date; the dimension's unique key.
        granularity: day
        data_tests:
          - not_null
          - unique
      - name: year_number
        description: Calendar year.
      - name: quarter_number
        description: Calendar quarter, 1 through 4.
      - name: month_number
        description: Calendar month, 1 through 12.
      - name: day_of_month
        description: Day of the month.
      - name: month_start
        description: First calendar date of the month.

  - name: mart_cleared_lifecycle_by_year_type
    config:
      contract:
        enforced: true
    description: >-
      Closed-permit lifecycle duration statistics by application year,
      permit type, and lifecycle measure. Negative intervals are counted
      separately and excluded from published duration statistics.
      Recent years are subject to closure-selection bias; 2026 is partial.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - application_year
              - permit_type
              - measure
    columns:
      - name: application_year
        data_type: INTEGER
        description: Calendar year of application.
        data_tests:
          - not_null
      - name: permit_type
        data_type: VARCHAR
        description: City-defined permit type.
        data_tests:
          - not_null
      - name: measure
        data_type: VARCHAR
        description: Lifecycle interval being summarized.
        data_tests:
          - not_null
      - name: eligible_date_pairs
        data_type: BIGINT
        description: Number of revisions with both dates available for the measure.
      - name: negative_interval_count
        data_type: BIGINT
        description: Number of eligible revisions with a negative raw duration.
      - name: publishable_duration_count
        data_type: BIGINT
        description: Number of eligible revisions with a non-negative duration.
      - name: negative_interval_rate_pct
        data_type: DOUBLE
        description: Percentage of eligible date pairs with a negative duration.
      - name: median_days
        data_type: DOUBLE
        description: Median non-negative elapsed calendar days.
      - name: p90_days
        data_type: DOUBLE
        description: 90th percentile of non-negative elapsed calendar days, rounded to two decimal places.
      - name: max_days
        data_type: BIGINT
        description: Maximum non-negative elapsed calendar days.

  - name: dim_permit_type
    description: One row per distinct non-null permit type across the Active and Cleared permit facts.
    columns:
      - name: permit_type
        description: Natural key identifying a permit type.
        data_tests:
          - not_null
          - unique

  - name: mart_active_backlog_by_year_type
    config:
      contract:
        enforced: true
    description: >-
      Current logical Active permit revisions grouped by application year and
      permit type. Counts include both age-eligible and ineligible revisions;
      revisions without a usable application date remain visible in a null-year
      group. Age statistics and ageing thresholds use only age-eligible rows.
      Eligible backlog share is each group’s percentage of all eligible current
      Active revisions in this mart.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - application_year
              - permit_type
    columns:
      - name: application_year
        data_type: INTEGER
        description: Calendar year of application; null when no consolidated application date is available.
      - name: permit_type
        data_type: VARCHAR
        description: City-defined permit type.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_permit_type')
                field: permit_type
      - name: current_active_revision_count
        data_type: BIGINT
        description: Number of current logical Active revisions in the year and permit-type group.
        data_tests:
          - not_null
      - name: age_eligible_count
        data_type: BIGINT
        description: Number of revisions eligible for the Active age analysis.
        data_tests:
          - not_null
      - name: age_ineligible_count
        data_type: BIGINT
        description: Number of revisions excluded from the Active age analysis.
        data_tests:
          - not_null
      - name: over_365_days_count
        data_type: BIGINT
        description: Eligible current Active revisions with an observed age greater than 365 calendar days.
        data_tests:
          - not_null
      - name: over_730_days_count
        data_type: BIGINT
        description: Eligible current Active revisions with an observed age greater than 730 calendar days.
        data_tests:
          - not_null
      - name: over_1095_days_count
        data_type: BIGINT
        description: Eligible current Active revisions with an observed age greater than 1,095 calendar days.
        data_tests:
          - not_null
      - name: median_age_days
        data_type: DOUBLE
        description: Median elapsed calendar-day age among age-eligible revisions; null when the group has no eligible revisions.
      - name: p90_age_days
        data_type: DOUBLE
        description: 90th percentile of elapsed calendar-day age among age-eligible revisions, rounded to two decimal places; null when none are eligible.
      - name: eligible_backlog_share_pct
        data_type: DOUBLE
        description: Percentage contribution of this group to all age-eligible current Active revisions across the mart.

  - name: mart_cleared_lifecycle_matched_by_year_type
    config:
      contract:
        enforced: true
    description: >-
      Lifecycle duration statistics by application year, permit type, and
      interval for one matched cohort of Closed logical revisions. A revision
      is included only when all three lifecycle dates are present and satisfy
      application_date <= issued_date <= completed_date. The matched cohort
      count is therefore identical across all three interval measures within
      a year and permit-type group. Recent years remain subject to
      closure-selection bias and 2026 is partial.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - application_year
              - permit_type
              - measure
    columns:
      - name: application_year
        data_type: INTEGER
        description: Calendar year of application.
        data_tests:
          - not_null
      - name: permit_type
        data_type: VARCHAR
        description: City-defined permit type.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_permit_type')
                field: permit_type
      - name: measure
        data_type: VARCHAR
        description: Lifecycle interval being summarized.
        data_tests:
          - not_null
      - name: matched_cohort_count
        data_type: BIGINT
        description: Number of Closed logical revisions in the shared matched cohort for this year, permit type, and measure.
        data_tests:
          - not_null
      - name: median_days
        data_type: DOUBLE
        description: Median non-negative elapsed calendar days for the matched cohort.
        data_tests:
          - not_null
      - name: p90_days
        data_type: DOUBLE
        description: 90th percentile of non-negative elapsed calendar days for the matched cohort, rounded to two decimal places.
        data_tests:
          - not_null


  - name: mart_active_backlog_summary
    config:
      contract:
        enforced: true
    description: >-
      Dashboard-ready Active backlog summaries at overall, application-year, and
      permit-type levels. All medians and P90s are calculated from individual
      eligible logical revisions, not from previously aggregated groups. The
      overall row also carries the 2024-and-later cohort share, top-five permit
      type share of the over-365-day backlog, and latest observed application year.
    columns:
      - name: summary_level
        data_type: VARCHAR
        description: One of overall, application_year, or permit_type.
        data_tests: [not_null]
      - name: application_year
        data_type: INTEGER
        description: Application year for application_year rows; null for other summary levels and for undated revisions.
      - name: permit_type
        data_type: VARCHAR
        description: Permit type for permit_type rows; null for other summary levels.
      - name: current_active_revision_count
        data_type: BIGINT
        description: Current logical Active revisions in the selected summary group.
        data_tests: [not_null]
      - name: age_eligible_count
        data_type: BIGINT
        description: Revisions eligible for Active age analysis.
        data_tests: [not_null]
      - name: age_ineligible_count
        data_type: BIGINT
        description: Revisions excluded from Active age analysis.
        data_tests: [not_null]
      - name: over_365_days_count
        data_type: BIGINT
        description: Eligible revisions older than 365 calendar days.
        data_tests: [not_null]
      - name: over_730_days_count
        data_type: BIGINT
        description: Eligible revisions older than 730 calendar days.
        data_tests: [not_null]
      - name: over_1095_days_count
        data_type: BIGINT
        description: Eligible revisions older than 1,095 calendar days.
        data_tests: [not_null]
      - name: median_age_days
        data_type: DOUBLE
        description: Median age from individual eligible revisions in the group.
      - name: p90_age_days
        data_type: DOUBLE
        description: 90th percentile age from individual eligible revisions in the group.
      - name: eligible_backlog_share_pct
        data_type: DOUBLE
        description: Group contribution to all eligible current Active revisions; 100 for the overall row.
      - name: recent_cohort_2024_plus_share_pct
        data_type: DOUBLE
        description: Overall-row share of eligible backlog with application year 2024 or later.
      - name: top_five_over_365_share_pct
        data_type: DOUBLE
        description: Overall-row share of the over-365-day eligible backlog accounted for by the five largest permit types.
      - name: latest_application_year
        data_type: INTEGER
        description: Latest non-null application year, populated on the overall row.

  - name: mart_cleared_lifecycle_pooled
    config:
      contract:
        enforced: true
    description: >-
      Pooled lifecycle duration statistics calculated directly from individual
      Closed logical revisions in one shared matched cohort with all three dates
      present and application_date <= issued_date <= completed_date.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [measure]
    columns:
      - name: measure
        data_type: VARCHAR
        description: Lifecycle interval being summarized.
        data_tests: [not_null]
      - name: matched_cohort_count
        data_type: BIGINT
        description: Number of revisions in the shared matched cohort.
        data_tests: [not_null]
      - name: median_days
        data_type: DOUBLE
        description: Pooled median elapsed calendar days across individual revisions.
        data_tests: [not_null]
      - name: p90_days
        data_type: DOUBLE
        description: Pooled 90th percentile elapsed calendar days across individual revisions.
        data_tests: [not_null]

  - name: mart_data_quality_summary
    config:
      contract:
        enforced: true
    description: >-
      Metric-level Active and Cleared data-quality aggregates, Active age
      exclusions, and a mutually exclusive reconciliation of the matched
      three-date Closed lifecycle cohort. Dashboard adapters read these
      prepared values and do not reproduce quality aggregation SQL.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [metric_name]
    columns:
      - name: metric_name
        data_type: VARCHAR
        description: Stable metric key consumed by the dashboard.
        data_tests: [not_null]
      - name: metric_value
        data_type: BIGINT
        description: Non-negative logical-revision count for the metric.
        data_tests: [not_null]
